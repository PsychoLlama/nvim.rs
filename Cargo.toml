# Virtual workspace manifest: the packages live under crates/. Profiles are
# workspace-root-only by cargo's rules, so they stay here.
[workspace]
resolver = "3"
members = [
  "crates/mainthread",
  "crates/nvim",
]

[profile.release]
strip = "debuginfo"

# The GlobalCell debug assertion calls into nvim-mainthread on every global
# access; unoptimized it costs enough to blow the timing-sensitive oldtests
# (see crates/mainthread/lib.rs). Optimize it in every profile.
[profile.dev.package.nvim-mainthread]
opt-level = 3
