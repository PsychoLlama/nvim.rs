[package]
name = "nvim-mainthread"
version = "0.0.0"
publish = false
edition = "2024"

[lib]
path = "lib.rs"

# See crates/nvim/Cargo.toml: `pub` means externally reachable, tree-wide.
[lints.rust]
unreachable_pub = "deny"
unused_qualifications = "deny"

# See crates/nvim/Cargo.toml: the cast family is denied crate-wide.
[lints.clippy]
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
ptr_as_ptr = "deny"
