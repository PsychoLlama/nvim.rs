[package]
name = "neovim"
version = "0.0.0"
publish = false
edition = "2024"
autobins = false
# Enumerate package files explicitly so cargo lists them by walking the
# directory instead of reading neovim's git index — cargo's bundled libgit2
# rejects that index's checksum ("invalid data in index").
include = ["**/*.rs", "Cargo.toml", "build.rs"]

[lib]
name = "neovim"
path = "src/lib.rs"
# rlib only. The `nvim` binary links this as a Rust library, and the unit
# tests reach the editor's `#[unsafe(no_mangle)]` symbols through the binary
# itself (`dlsym(RTLD_DEFAULT)`, courtesy of the `--export-dynamic` build.rs
# adds). Nothing has ever linked a `libneovim.a`.
crate-type = ["rlib"]

# Runnable `nvim` executable. `autobins = false` above disables bin
# auto-discovery, so the entry point is declared explicitly here; it just
# calls the `main()` in src/main.rs.
[[bin]]
name = "nvim"
path = "src/bin/nvim.rs"
# No #[test]s live in the bin; keep `cargo test --tests` from linking a
# second full nvim just to run zero tests.
test = false

# The dependency policy. A crate enters this table only when all three hold:
#
#  1. it is pure Rust, or its `-sys` build is owned by `nix/deps.json` (the
#     nix build reads `Cargo.lock` directly, so a pure-Rust crate costs
#     nothing beyond the lock entry);
#  2. it replaces a *shape* — an error derive, a flag set, a C library's
#     whole API — and not a behaviour the editor is observed on; and
#  3. the swap is gated by an oracle that already passes.
#
# Each entry says which shape it replaced.
[dependencies]
# The libc bindings the transpiled tree calls through. Not a shape: this is
# the C standard library, and it predates the policy.
libc = "0.2"
# The main-thread assertion behind `GlobalCell`; a crate of this repo's own.
nvim-mainthread = { path = "../mainthread" }
# The error derive. It replaces hand-written `Display`/`std::error::Error`
# impls — starting with `api::Error`, whose message an editor shows rather
# than reports. Pure Rust, proc-macro only, nothing of it survives into the
# binary but the impls it wrote.
thiserror = { version = "2", default-features = false, features = ["std"] }

# Edition 2024 warns when an `unsafe fn` body uses unsafe operations without an
# explicit `unsafe {}` block. Allowed here only for the sibling bin/test/bench
# crate roots; every file in the library denies it, and lib.rs denies it
# crate-wide on top.
[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

# `unsafe_code` is allow-by-default, so silence was the tree's only answer for
# where unsafe may live — and silence is not a claim a file makes, it is one it
# fails to make. Denying it inverts that: a file that needs unsafe says so with
# an inner `#![allow(unsafe_code)]` and a one-line reason, and scripts/ratchet.py
# holds `files_allowing_unsafe_code` shrink-only. A perimeter module names its
# row in docs/perimeter.md; anything else is debt. `forbid` still wins over this
# deny and cannot be lifted, so a finished module keeps taking it.
unsafe_code = "deny"

# The crate root is a flat namespace of ~130 `pub mod`s, so for most of the
# migration `pub` said nothing. What the deny buys is a real invariant: inside
# this crate, **`pub` now means externally reachable**, which is what makes a
# visibility ledger over the `pub` surface mean anything. The fix for a new
# finding is to narrow the item, not to widen its module.
unreachable_pub = "deny"
unused_qualifications = "deny"

# c2rust wrote every name the C's way. What the port owns has been renamed; what
# it does not carries an allow with a reason — an API method's own name
# (`nvim__id`, and every wrapper apigen derives from it) on the item, and five
# files whose *value* names are someone else's (LuaJIT's `L`, apigen's
# `is_set__<name>_` keyset mask) on the file. `files_allowing_non_snake_case`
# may only fall. Denied here rather than on the lib target so the bin, test and
# bench roots are held to it too, as with the four below.
non_snake_case = "deny"

# c2rust wrote `mut` on every binding it emitted, whether or not the value was
# ever reassigned. `cargo fix` cleared all of them mechanically: a binding that
# is never reassigned reads the same either way.
unused_mut = "deny"

# The same habit one step further, a binding initialised and then overwritten
# before anything read it. Five sites keep a local `#[allow]` because the lint
# is not alias-aware — rustc's liveness stops at a local's last *direct* use, so
# a write reached only through a raw pointer taken earlier (an `iconv` length, a
# Lua array behind an `Array.items`) reads as dead when it is the whole point of
# the statement.
unused_assignments = "deny"

# Every type c2rust emitted wore the C's name. The tree's own are renamed; the
# 171 left belong to somebody else — libuv's `uv_loop_t`, libc's `size_t`,
# LuaJIT's `lua_CFunction`, libmpack's tokens — plus c2rust's names for
# anonymous struct members. Those 26 files carry a per-file `#![allow]` with a
# one-line reason, held shrink-only as `files_allowing_non_camel_case_types`.
non_camel_case_types = "deny"

# The value half of the same story, and the largest: almost none of these can be
# renamed. A `p_<abbrev>` is the option table's `var` field, a `kOpt<Name>` is an
# index the option metadata spells, a `KEYSET_OPTIDX_<method>__<key>` is a mask
# bit apigen derives, `_ISalnum` and `TSQueryErrorNone` are glibc's and
# tree-sitter's, and the rest are the names upstream's C uses for the editor's
# own state. So 298 files carry a per-file `#![allow]` with a one-line reason,
# eight generated files get theirs from apigen (a hand-written one would not
# survive `just apigen`), and `lua/xdiff.rs` answers for six function-local
# constants on the item. `files_allowing_non_upper_case_globals` falls a file at
# a time as a module is rewritten to Rust's spelling.
non_upper_case_globals = "deny"

# `just lint` runs clippy with correctness at its deny default; suspicious,
# complexity, perf and style warn and burn down through the ratchet
# (metrics/clippy.json). The opt-in groups (pedantic, restriction, nursery,
# cargo) stay at their allow default. `missing_safety_doc` was allowed here
# until the last `# Safety` section was written; it is a plain `warn` again,
# which `-D warnings` makes a deny, so leave it that way. One style member stays
# off, for a reason that does not retire with a rewrite:
# `just randomize-layout` sets this alongside `-Zrandomize-layout`. The tree
# holds a handful of const assertions that pin a `repr(Rust)` type's size --
# memory budgets for what a dictionary item or a list item costs -- and the
# compiler makes no such promise: randomizing the layout is exactly the
# compiler exercising that freedom, so those guards stand down for that lane
# and nowhere else.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(randomized_layout)']

[lints.clippy]
# `tui/tui.rs`, `vterm/vterm.rs`, `tui/termkey/termkey.rs`,
# `viml/parser/parser.rs` and `types/types.rs` are ports of upstream's
# `tui/tui.c`, `vterm/vterm.c`, `tui/termkey/termkey.c`, `viml/parser/parser.c`
# and `types_defs.h`. The repeated name is the mapping back to the C, which is
# worth more than the nesting costs.
module_inception = "allow"
