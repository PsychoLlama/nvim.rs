[package]
name = "neovim"
version = "0.0.0"
publish = false
edition = "2024"
autobins = false
# Enumerate package files explicitly so cargo lists them by walking the
# directory instead of reading neovim's git index — cargo's bundled libgit2
# rejects that index's checksum ("invalid data in index").
include = ["**/*.rs", "Cargo.toml", "build.rs"]

[lib]
name = "neovim"
path = "src/lib.rs"
# rlib only. The `nvim` binary links this as a Rust library, and the unit
# tests reach the editor's `#[unsafe(no_mangle)]` symbols through the binary
# itself (`dlsym(RTLD_DEFAULT)`, courtesy of the `--export-dynamic` build.rs
# adds). Nothing has ever linked a `libneovim.a`.
crate-type = ["rlib"]

# Runnable `nvim` executable. `autobins = false` above disables bin
# auto-discovery, so the entry point is declared explicitly here; it just
# calls the `main()` in src/main.rs.
[[bin]]
name = "nvim"
path = "src/bin/nvim.rs"
# No #[test]s live in the bin; keep `cargo test --tests` from linking a
# second full nvim just to run zero tests.
test = false

# The dependency policy. A crate enters this table only when all three hold:
#
#  1. it is pure Rust, or its `-sys` build is owned by `nix/deps.json` (the
#     nix build reads `Cargo.lock` directly, so a pure-Rust crate costs
#     nothing beyond the lock entry);
#  2. it replaces a *shape* — an error derive, a flag set, a C library's
#     whole API — and not a behaviour the editor is observed on; and
#  3. the swap is gated by an oracle that already passes.
#
# Each entry says which shape it replaced.
[dependencies]
# The libc bindings the transpiled tree calls through. Not a shape: this is
# the C standard library, and it predates the policy.
libc = "0.2"
# The main-thread assertion behind `GlobalCell`; a crate of this repo's own.
nvim-mainthread = { path = "../mainthread" }
# The error derive. It replaces hand-written `Display`/`std::error::Error`
# impls — starting with `api::Error`, whose message an editor shows rather
# than reports, which is why no report-style error crate (`anyhow`,
# `eyre`, `miette`) enters here: an editor-internal error is a Vim message,
# not a diagnostic with a backtrace and a source chain. Pure Rust, proc-macro
# only, nothing of it survives into the binary but the impls it wrote.
thiserror = { version = "2", default-features = false, features = ["std"] }

# Edition 2024 warns when an `unsafe fn` body uses unsafe operations without
# an explicit `unsafe {}` block. The transpiled tree has thousands of such
# fns; blanket-wrapping their bodies would double the textual `unsafe` count
# the ratchet tracks while making nothing safer. So the lint is allowed here,
# and modules deny it as they are rewritten — rewrites eliminate unsafe
# instead of annotating it. Every file in the library now does, and lib.rs
# denies it crate-wide on top; this allow survives only for the sibling
# bin/test/bench crate roots, which this table also governs.
[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

# The crate root is a flat namespace of ~130 `pub mod`s, so for most of the
# migration "pub" said nothing: an item was `pub` because c2rust made every
# translation unit's symbols visible, not because anything outside reached it.
# Both of these were counted down to zero as ratcheted totals (they are
# allow-by-default, so the count had to be asked for) and are denied here
# instead, the same way the `warnings` metric retired into RUSTFLAGS once it
# hit zero. What the deny buys is a real invariant: inside this crate,
# **`pub` now means externally reachable**, which is what makes a visibility
# ledger over the `pub` surface mean anything. The fix for a new finding is to
# narrow the item, not to widen its module.
unreachable_pub = "deny"
unused_qualifications = "deny"

# `just lint` runs clippy with correctness at its deny default; suspicious/
# complexity/perf/style warn and burn down through the ratchet
# (metrics/clippy.json). The opt-in groups (pedantic, restriction, nursery,
# cargo) stay at their allow default.
#
# `style` was allowed tree-wide until phase 19 turned it on: 3 256 findings,
# of which 855 were real and are now zero. Two members stay off, for reasons
# that do not retire with a rewrite:
[lints.clippy]
# 2 380 findings, and 2 380 `# Safety` sections is not a slice, it is a phase.
# The debt is real, so it is not simply forgotten: scripts/ratchet.py counts it
# per file under `missing_safety_doc` and holds it shrink-only, which is where
# it belongs — it is documentation debt that retires as modules are rewritten,
# not a lint a module can be clean of today. Allowed here so `just lint` still
# reports the findings a change is answerable for.
missing_safety_doc = "allow"
# `tui/tui.rs`, `vterm/vterm.rs`, `tui/termkey/termkey.rs`,
# `viml/parser/parser.rs` and `types/types.rs` are ports of upstream's
# `tui/tui.c`, `vterm/vterm.c`, `tui/termkey/termkey.c`,
# `viml/parser/parser.c` and `types_defs.h`. The repeated name is the mapping
# back to the C, which is worth more than the nesting costs.
module_inception = "allow"
