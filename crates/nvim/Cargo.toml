[package]
name = "neovim"
version = "0.0.0"
publish = false
edition = "2024"
autobins = false
# Enumerate package files explicitly so cargo lists them by walking the
# directory instead of reading neovim's git index — cargo's bundled libgit2
# rejects that index's checksum ("invalid data in index").
include = ["**/*.rs", "Cargo.toml", "build.rs"]

[lib]
name = "neovim"
path = "src/lib.rs"
# rlib only. The `nvim` binary links this as a Rust library, and the unit
# tests reach the editor's `#[unsafe(no_mangle)]` symbols through the binary
# itself (`dlsym(RTLD_DEFAULT)`, courtesy of the `--export-dynamic` build.rs
# adds). Nothing has ever linked a `libneovim.a`.
crate-type = ["rlib"]

# Runnable `nvim` executable. `autobins = false` above disables bin
# auto-discovery, so the entry point is declared explicitly here; it just
# calls the `main()` in src/main.rs.
[[bin]]
name = "nvim"
path = "src/bin/nvim.rs"
# No #[test]s live in the bin; keep `cargo test --tests` from linking a
# second full nvim just to run zero tests.
test = false

# The dependency policy. A crate enters this table only when all three hold:
#
#  1. it is pure Rust, or its `-sys` build is owned by `nix/deps.json` (the
#     nix build reads `Cargo.lock` directly, so a pure-Rust crate costs
#     nothing beyond the lock entry);
#  2. it replaces a *shape* — an error derive, a flag set, a C library's
#     whole API — and not a behaviour the editor is observed on; and
#  3. the swap is gated by an oracle that already passes.
#
# Each entry says which shape it replaced.
[dependencies]
# The libc bindings the transpiled tree calls through. Not a shape: this is
# the C standard library, and it predates the policy.
libc = "0.2"
# The main-thread assertion behind `GlobalCell`; a crate of this repo's own.
nvim-mainthread = { path = "../mainthread" }
# The error derive. It replaces hand-written `Display`/`std::error::Error`
# impls — starting with `api::Error`, whose message an editor shows rather
# than reports. Pure Rust, proc-macro only, nothing of it survives into the
# binary but the impls it wrote.
thiserror = { version = "2", default-features = false, features = ["std"] }

# Edition 2024 warns when an `unsafe fn` body uses unsafe operations without
# an explicit `unsafe {}` block. The transpiled tree has thousands of such
# fns; blanket-wrapping their bodies would double the textual `unsafe` count
# the ratchet tracks while making nothing safer. So the lint is allowed here,
# and modules deny it as they are rewritten — rewrites eliminate unsafe
# instead of annotating it. Every file in the library now does, and lib.rs
# denies it crate-wide on top; this allow survives only for the sibling
# bin/test/bench crate roots, which this table also governs.
[lints.rust]
unsafe_op_in_unsafe_fn = "allow"

# The posture flip (roadmap phase 28 item 5). `unsafe_code` is allow-by-default,
# so for the whole transpile nothing said where unsafe was allowed to live —
# the tree's answer was the *absence* of `#![forbid(unsafe_code)]`, which is
# not a claim a file makes, it is one it fails to make. Denying it here inverts
# that: a file that needs `unsafe` — a block, an `unsafe fn`, an `unsafe trait`
# or `impl`, an `unsafe extern` block, an `#[unsafe(no_mangle)]` export — says
# so with an inner `#![allow(unsafe_code)]` and a one-line reason, and
# scripts/ratchet.py holds `files_allowing_unsafe_code` shrink-only. A
# perimeter module (docs/perimeter.md) names its row; anything else is debt,
# and the count is what the migration has left to do. `forbid` still wins over
# this deny and cannot be lifted, so a finished module keeps taking it.
unsafe_code = "deny"

# The crate root is a flat namespace of ~130 `pub mod`s, so for most of the
# migration "pub" said nothing: an item was `pub` because c2rust made every
# translation unit's symbols visible, not because anything outside reached it.
# Both of these were counted down to zero as ratcheted totals (they are
# allow-by-default, so the count had to be asked for) and are denied here
# instead, the same way the `warnings` metric retired into RUSTFLAGS once it
# hit zero. What the deny buys is a real invariant: inside this crate,
# **`pub` now means externally reachable**, which is what makes a visibility
# ledger over the `pub` surface mean anything. The fix for a new finding is to
# narrow the item, not to widen its module.
unreachable_pub = "deny"
unused_qualifications = "deny"

# c2rust wrote every name the C's way, so `non_snake_case` was allowed at the
# crate root for the whole transpile. Phase 27 renamed what the port owns and
# marked what it does not: an API method's own name (`nvim__id`, and every
# wrapper apigen derives from it) carries an item-level allow, and five files
# whose *value* names are someone else's -- LuaJIT's `L`, apigen's
# `is_set__<name>_` keyset mask -- carry a file-level one with a reason. The
# ratchet's `files_allowing_non_snake_case` may only fall from there. Denying
# it here rather than on the lib target means the bin, test and bench roots
# are held to it too.
non_snake_case = "deny"

# c2rust wrote `mut` on every binding it emitted, whether or not the value was
# ever reassigned — 956 findings in 169 files at the point the allow came off.
# `cargo fix` cleared all of them mechanically (the fix is textual and cannot
# change behaviour: a binding that is never reassigned reads the same either
# way). Denied here rather than in lib.rs so it also governs the bin/test/bench
# roots, which were already clean.
unused_mut = "deny"

# The same transpiler habit one step further: 121 findings in 67 files where a
# binding was initialised and then overwritten before anything read it. All but
# five were dead stores or `let mut x = 0; … x = f();` shapes and are gone. The
# five that stay carry a local `#[allow]`: the lint is not alias-aware — rustc's
# liveness stops at a local's last *direct* use, so a write reached only through
# a raw pointer taken earlier (an `iconv` length, a Lua array behind an
# `Array.items`) reads as dead when it is the whole point of the statement.
unused_assignments = "deny"

# Every type c2rust emitted wore the C's name, so the crate root allowed this
# for the whole transpile — 452 findings when the allow came off. Phase 27
# renamed the tree's own types (the 212 `_T` typedefs, the `_S` tags and the
# lowercase struct tags under them); what is left is 171 names that belong to
# somebody else — libuv's `uv_loop_t`, libc's `size_t`, LuaJIT's
# `lua_CFunction`, libmpack's tokens — plus c2rust's names for anonymous
# struct members. Those 26 files carry a per-file `#![allow]` with a one-line
# reason, and scripts/ratchet.py holds the count of them shrink-only under
# `files_allowing_non_camel_case_types`. Denied here rather than in lib.rs so
# it also governs the bin/test/bench roots, which were already clean.
non_camel_case_types = "deny"

# The value half of the same story, and the largest of the four: 4 386
# findings when the allow came off, which is every global the editor has.
# Almost none of them can be renamed. A `p_<abbrev>` is the option table's
# `var` field, a `kOpt<Name>` is an index the option metadata spells, a
# `KEYSET_OPTIDX_<method>__<key>` is a mask bit apigen derives, `_ISalnum`
# and `TSQueryErrorNone` are glibc's and tree-sitter's, and the rest are the
# names upstream's C uses for the editor's own state. So this lift renamed
# only what the port itself had named (`redo_block`/`redo_at`,
# `last_bufname`/`last_bufref`) and marked the rest: 298 files carry a
# per-file `#![allow]` with a one-line reason, eight generated files get
# theirs from apigen (a hand-written one would not survive `just apigen`),
# and `lua/xdiff.rs` answers for six function-local constants on the item.
# scripts/ratchet.py holds `files_allowing_non_upper_case_globals`
# shrink-only, and it falls a file at a time as a module is rewritten to
# Rust's spelling. Denied here rather than in lib.rs so it also governs the
# bin/test/bench roots, which were already clean.
non_upper_case_globals = "deny"

# `just lint` runs clippy with correctness at its deny default; suspicious/
# complexity/perf/style warn and burn down through the ratchet
# (metrics/clippy.json). The opt-in groups (pedantic, restriction, nursery,
# cargo) stay at their allow default.
#
# `style` was allowed tree-wide until phase 19 turned it on: 3 256 findings,
# of which 855 were real and are now zero. Two members stay off, for reasons
# that do not retire with a rewrite:
[lints.clippy]
# 2 380 findings, and 2 380 `# Safety` sections is not a slice, it is a phase.
# The debt is real, so it is not simply forgotten: scripts/ratchet.py counts it
# per file under `missing_safety_doc` and holds it shrink-only, which is where
# it belongs — it is documentation debt that retires as modules are rewritten,
# not a lint a module can be clean of today. Allowed here so `just lint` still
# reports the findings a change is answerable for.
missing_safety_doc = "allow"
# `tui/tui.rs`, `vterm/vterm.rs`, `tui/termkey/termkey.rs`,
# `viml/parser/parser.rs` and `types/types.rs` are ports of upstream's
# `tui/tui.c`, `vterm/vterm.c`, `tui/termkey/termkey.c`,
# `viml/parser/parser.c` and `types_defs.h`. The repeated name is the mapping
# back to the C, which is worth more than the nesting costs.
module_inception = "allow"
