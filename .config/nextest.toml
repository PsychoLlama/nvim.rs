# cargo-nextest runs `tests/unit` (`just cargo-unit`, and the `cargo-test`
# step of `minimal-ci`): one process per case, as many at once as there are
# cores. The lib tests and the doctests stay on `cargo test`.
#
# A process per case is what makes the shared editor safe to fan out: each
# case gets the editor fresh (`support::init_editor`), in a state and swap
# directory of its process's own. A case therefore may not lean on what an
# earlier one left behind; run one alone (`just cargo-unit <name>`) to check.

[profile.default]
# The slowest cases (the printf oracles) take ~40 s alone and longer beside
# eleven others. A case still running at two minutes is hung: kill it and
# fail it rather than hold the lane. A case left waiting for a key does not
# get this far -- it panics within 'updatetime' (`refuse_endless_waits`).
slow-timeout = { period = "30s", terminate-after = 4 }
# One run lists every failure, not the first.
fail-fast = false
# Print a case's output once, in the summary, rather than interleaved.
failure-output = "final"
status-level = "slow"
final-status-level = "slow"
